name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # `brew audit`/`test` only accept formula names, not paths, so expose this
      # checkout to Homebrew as the getprovenant/tap tap.
      - name: Register the checkout as a local tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/getprovenant/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Audit the formula
        run: brew audit --strict --online getprovenant/tap/provenant

      - name: Install from the formula
        run: brew install getprovenant/tap/provenant

      - name: Test the formula
        run: brew test getprovenant/tap/provenant
